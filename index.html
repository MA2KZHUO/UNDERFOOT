<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{ color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body{ margin:0; font:14px/1.5 system-ui, sans-serif; background:#F6F4EF; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
<title>Underfoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">

<style>
/* Layout: at rest the nine relief prints sit at their spacing along the block —
   small, flat, nothing happening. Hover one and it fills the screen while the
   others fall back to ghosts. Click it for the record. */
:root{
  --paper:#F6F4EF;
  --ink:#131211;
  --rule:#DCD8D0;
  --soft:#5E5A53;
  --grey:#A8A29A;
  --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Space Mono','Courier New',ui-monospace,monospace;
  color-scheme: light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}

.frame{position:fixed; inset:0; display:flex; flex-direction:column}

.topbar{
  flex:0 0 auto;
  padding-inline:clamp(16px,4vw,48px);
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--grey);
  display:flex; align-items:baseline;
  position:relative; z-index:40; pointer-events:none;
}
/* the page scrolls under it now, so it needs a floor */
.topbar{padding-block:clamp(14px,3vh,26px) clamp(8px,1.6vh,14px);
        background:var(--paper)}
.topbar b{color:var(--ink); font-weight:700; letter-spacing:.2em}

/* The home is one tall page: the row of prints, and under it the foot.
   The wheel does what a wheel does — it goes down. The row is moved
   sideways by dragging it, or by a sideways gesture, which is the
   motion the row is actually in. */
.stage{
  flex:1 1 auto; position:relative; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  overscroll-behavior-y:contain;
  /* No scroll-snap and no scroll-behavior on this container. With two
     sections exactly one screen apart, proximity snapping pulls every
     wheel tick back to where it started — the wheel stops working at all.
     The two buttons that jump ask for smooth themselves. */
}
#deck{
  position:relative; height:100%;
  padding-bottom:clamp(14px,3vh,26px);
}

#strip{position:absolute; inset:0; cursor:grab; touch-action:pan-y}

/* the only thing on the home that admits there is more page */
#cue{
  position:absolute; left:50%; bottom:clamp(10px,2.4vh,22px);
  transform:translateX(-50%);
  background:none; border:0; padding:8px 10px; cursor:pointer;
  font-family:var(--mono); font-size:13px; letter-spacing:.18em;
  color:var(--soft); z-index:14; transition:opacity .3s;
}
#cue:hover{color:var(--ink)}
#cue:focus-visible{outline:1px solid var(--ink); outline-offset:2px}
.scrolled #cue{opacity:0; pointer-events:none}
#strip.drag{cursor:grabbing}
#strip.gone{opacity:0; pointer-events:none; transition:opacity .4s}

.lid{
  position:absolute; left:50%; top:50%;
  border:0; padding:0; margin:0; background:none;
  transform-origin:center center; will-change:transform,opacity;
  line-height:0; cursor:pointer;
}
.lid img{display:block; width:100%; height:100%; pointer-events:none}
/* No ring on a print. Keyboard focus already shows itself — the focus
   handler engages the lid exactly as hover does, so it grows and gives
   its name. A rectangle on top of that is a second, louder answer to a
   question already answered, and it is the one shape this site has
   nowhere else. It has to be turned off explicitly, or the browser
   draws its own. */
.lid:focus,.lid:focus-visible{outline:none}

#focusTag{
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  color:var(--grey); white-space:nowrap; text-align:center;
  pointer-events:none; z-index:12; line-height:1.7; opacity:0;
}
#focusTag em{font-style:normal; color:var(--ink); letter-spacing:.18em}
/* What the position has been through, under its name, only while you are
   attending to that one lid. The piece says footfall is a record nobody
   has ever thought to keep. This is the site keeping it — which is the
   one thing a website can do that a sidewalk cannot. */
#focusTag i{
  display:block; font-style:normal; font-size:9px;
  letter-spacing:.16em; color:var(--grey); margin-top:5px;
}

#boot{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--grey);
  transition:opacity .4s;
}
#boot.gone{opacity:0; pointer-events:none}

#record{
  /* fixed, not absolute: the home is a scrolling page now, and an absolute
     overlay inside it would be as tall as the page and would scroll away */
  position:fixed; inset:0; z-index:30;
  background:var(--paper);
  overflow-y:auto; overscroll-behavior:contain;
  opacity:0; pointer-events:none; transition:opacity .35s;
}
#record.on{opacity:1; pointer-events:auto}

.specimen{
  display:grid; grid-template-columns:46% 54%;
  max-width:1500px; margin:0 auto;
  padding-inline:clamp(16px,5vw,64px);
}
.lidcol{
  position:sticky; top:0; height:100vh;
  display:grid; place-items:center;
}

/* ───────────────────────────────────────── where the print sits on the page
   Not the same place every time. Nine lids are set into forty feet of
   sidewalk at nine different distances from the kerb, at nine different
   depths, and none of those were composition decisions — the pipe decided,
   and the pavement was poured around the result.

   So the print takes a different position in each record: which side of the
   page, how far up or down the screen, how large. Within one record it never
   moves. It is set, the way a lid is set, and then only worn. */
/* All of it is desktop only. On a phone there is one column and the print
   is pinned at the top of it: there is no side to be on, and a sideways
   nudge would just push the print off its own column. */
@media (min-width:821px){
  #record.side-r .specimen{ grid-template-columns:54% 46% }
  #record.side-r .lidcol{ order:2 }
  #record.side-r .textcol{ order:1; padding-right:clamp(40px,5vw,82px) }

  #record.vt-t .lidcol{ align-items:start; padding-top:11vh }
  #record.vt-b .lidcol{ align-items:end;   padding-bottom:13vh }

  /* a static offset inside the column — set once when the record opens,
     never touched again by the scroll */
  .lidcol canvas{ transform:translateX(calc(var(--lx,0) * 1%)) }
}
/* the print is square and stays square: if the column is ever narrower than
   the canvas, both axes come down together instead of the width alone */
.lidcol canvas{display:block; max-width:100%; height:auto; aspect-ratio:1/1}
/* ═══════════════════════════════════════════════ the record, as typography
   Twelve tracks. Every fragment starts on a track and runs a whole number
   of them, so the page has a structure you can feel before you read a word.
   The irregularity is composed, not random: the same handful of positions
   and measures recur, which is the difference between rhythm and noise. */
.textcol{
  --unit:clamp(13px,1.55vh,23px);     /* one vertical step; all gaps are multiples */
  display:grid;
  grid-template-columns:repeat(12,1fr);
  column-gap:clamp(8px,1.1vw,18px);
  padding-block:38vh 58vh;
  padding-left:clamp(20px,4vw,64px);
}
.textcol > *{
  grid-column:var(--c,1) / span var(--sp,5);
  margin:0 0 calc(var(--g,4) * var(--unit));
  position:relative;
}

/* ── three voices, all monospaced ────────────────────────────────────────
   Which voice a fragment gets is decided by the fragment, not by its place
   in the list: short sentences carry, long ones explain. The hierarchy is
   therefore written into the text rather than imposed on top of it.

   The record is set in the mono. A monospaced face gives every character
   the same width whatever it is — which is exactly what the sidewalk does:
   every letter gets the same footfall, and the ones with less material
   behind them go first. It is also the register the thing was written in:
   a specification, a schedule, a log. Public Sans is left to the one place
   that is explaining rather than recording.

   Mono sets wider and heavier than the sans at the same size, so every
   size here is corrected down and every line-height opened up. And because
   Space Mono has only two weights, the lead has to take the 700 — without
   it the hierarchy would be carried by size alone, which is not enough. */
/* ── the sentences wear too ───────────────────────────────────────────────
   --f is how far this particular fragment has been read past: 0 while it is
   still ahead of you, 1 once it is well behind. The ink is mixed back into
   the paper by that amount, so a line you have finished with is going the
   same way the print is going, by the same act, at the same time.

   It is mixed toward the paper rather than toward grey. Grey would be a
   different colour arriving on the page. This is the same colour leaving. */
.textcol .line{
  text-wrap:pretty;
  color:var(--ink);                                   /* if color-mix is out */
  color:color-mix(in oklab,
        var(--ink),
        var(--paper) calc((var(--f,0) * 70 + var(--r,0) * 9) * 1%));
}

.l-pivot{                                  /* the turns */
  font-family:var(--mono); font-weight:400;
  font-size:clamp(14px,1.05vw,16.5px);
  line-height:1.6; letter-spacing:-.004em;
  text-wrap:balance;
}
.l-body{                                   /* the reading voice */
  font-family:var(--mono); font-weight:400;
  font-size:clamp(12px,0.82vw,13.5px);
  line-height:1.95;
}
.l-pivot.flush{ text-align:right }         /* one hard edge against the rag */



/* ── the composition comes apart ──────────────────────────────────────────
   --r is the read position: 0 at the top, 1 at the end. The same number
   that wears the print lets go of the grid. Fragments leave along the axis
   they were set on — the deep indents run further out, the flush-left ones
   fall back — so the page disassembles along its own structure instead of
   scattering. The print itself does not move: it is set into the page the
   way the lid is set into the sidewalk. */
.textcol .line{
  /* it opens up, but the type never shouts */
  transform:translateX(calc(var(--r,0) * ((var(--c,1) - 1) * 7px - 16px)));
}
.textcol .l-body{  max-width:calc((30 + var(--r,0) * 7) * 1ch) }
.textcol .l-pivot{ max-width:calc((28 + var(--r,0) * 7) * 1ch) }
#record.late .textcol .line{ max-width:38ch }
#record.late .l-pivot.flush{ text-align:left }

@media (max-width:820px){
  .specimen{grid-template-columns:1fr}
  .lidcol{height:44vh; top:0; background:var(--paper); z-index:1}
  /* one column: the grid has nothing to come apart into, so the hierarchy
     has to carry the page on its own */
  .textcol{
    grid-template-columns:1fr;
    padding-left:0; padding-block:12vh 56vh;
    --unit:clamp(11px,1.3vh,18px);
  }
  .textcol > *{grid-column:1 / -1; max-width:none}
  /* the drift has to be cancelled at the same specificity it was set at,
     or the fragments slide out past the sticky print into the page margin,
     where nothing is covering them */
  .textcol .line{transform:none; max-width:none}
  .textcol{position:relative; z-index:0; background:var(--paper)}
  .lidcol{z-index:2}
  /* the record scrolls under the print, so the line at the boundary was
     being cut through the middle of its letters. A short run of paper
     under the edge lets it go instead of slicing it. */
  .lidcol::after{
    content:""; position:absolute; left:0; right:0; top:100%; height:52px;
    background:linear-gradient(var(--paper), rgba(246,244,239,0));
    pointer-events:none;
  }
  .textcol .line{max-width:none}
  .l-pivot{font-size:clamp(14px,3.5vw,16.5px)}
  .l-body{font-size:13px; line-height:1.95}
  .l-pivot.flush{text-align:left}
  #record.late .textcol .line{max-width:none}
}

.nav{
  position:absolute; top:50%; transform:translateY(-50%);
  background:none; border:0; cursor:pointer; padding:16px 14px;
  font-family:var(--mono); font-size:16px; color:var(--grey);
}
.nav:hover{color:var(--ink)}
.nav:focus-visible{outline:2px solid var(--ink)}
#prev,#next{position:fixed}
#prev{left:clamp(4px,2vw,24px)} #next{right:clamp(4px,2vw,24px)}

#close{
  position:absolute; top:clamp(12px,3vh,26px); right:clamp(16px,4vw,48px);
  background:none; border:0; cursor:pointer; padding:6px 2px;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--grey);
}
#close:hover{color:var(--ink)}

/* ───────────────────────────────────────────────────────────── the foot
   About and colophon are one thing. Splitting them made two short pages
   that each needed the other to make sense: what it is, and what it is
   made of, are the same statement said twice. */
/* ───────────────────────────────────────────────────── the foot
   A footer, not a chapter. Everything a normal site puts down here —
   what the thing is, what it was made of, who made it — in one low band.
   It sizes to its content, so the home is one screen plus a strip. */
#foot{
  max-width:1500px; margin:0 auto;
  padding:clamp(40px,6vh,72px) clamp(16px,5vw,64px) clamp(26px,4vh,42px);
  display:grid; grid-template-columns:1fr; gap:22px clamp(28px,4vw,64px);
  font-family:var(--mono); font-size:11px; line-height:1.85;
  color:var(--soft);
}
/* Three columns, side by side, all the way down to a phone. The way to
   keep them side by side is not a breakpoint — it is to write lines short
   enough that no column ever has to rewrap. Nothing here is over 32
   characters, so a column 33 characters wide holds all of it, and the
   three blocks stay 4 lines against 4 lines against 4 lines at every
   width. Under 1100px the type steps down one notch to buy that room. */
@media (min-width:640px){
  #foot{grid-template-columns:repeat(3,1fr); gap:0 clamp(18px,2.6vw,64px)}
}
@media (min-width:768px) and (max-width:1099px){
  #foot{font-size:10px; gap:0 clamp(14px,2vw,28px)}
}
@media (min-width:640px) and (max-width:767px){
  #foot{font-size:9px; gap:0 12px; padding-inline:clamp(14px,3vw,28px)}
}
/* No labels. Three short columns in a footer do not need to be told apart
   by a grey word in caps — that is form filling, and it is the kind of
   furniture this site has been removing all along.

   And no flowing paragraphs: each column is four lines, each line a whole
   statement, broken where it was meant to break. Set as prose the three
   columns wrapped at three different places and ran to three different
   depths, which is what was making it look loose. Four lines against four
   lines against four lines sits still. */
#foot .who{color:var(--ink)}
#foot p{margin:0; text-wrap:pretty}
/* the whole block, in one line, under the three columns */
#foot .ledger{
  grid-column:1 / -1; margin-top:clamp(20px,3vh,34px);
  color:var(--grey); letter-spacing:.04em;
}


@media (prefers-reduced-motion:reduce){ #record,#boot{transition:none} }
</style>

</head>
<body>
<div class="frame">

  <div class="topbar">
    <span><b>UNDERFOOT</b></span>
  </div>

  <div class="stage">
   <div id="deck">
    <div id="strip"><div id="focusTag"></div></div>
    <div id="boot">LOADING THE PRINTS</div>
    <button id="cue" aria-label="About and colophon">&#8595;</button>
   </div>

    <div id="record">
      <article class="specimen">
        <div class="lidcol"><canvas id="big"></canvas></div>
        <div class="textcol" id="textcol"></div>
      </article>
      <button class="nav" id="prev" aria-label="Previous specimen">&#8592;</button>
      <button class="nav" id="next" aria-label="Next specimen">&#8594;</button>
      <button id="close">CLOSE &#215;</button>
    </div>

  <footer id="foot">
    <div>
      <p>Nine cast-iron curb boxes<br>
         211 Bay 35th Street, Brooklyn<br>
         Printed by hand, not photographed</p>
    </div>

    <div>
      <p>Relief prints, hand-pulled, 2026<br>
         Public Sans, Space Mono<br>
         Reading wears the print</p>
    </div>

    <div>
      <p><span class="who">Mark Zhuo</span><br>
         Core 3: Design Studio<br>
         Parsons &mdash; Fall 2026</p>
    </div>

    <p class="ledger" id="ledger"></p>
  </footer>

  </div>
</div>

<script>
(function(){
"use strict";

const LIDS = [
  {n:"01", src:"lid01.png", word:"MONITORING WELL", sub:"NOT TO FILL", ft: 0.0},
  {n:"02", src:"lid02.png", word:"WATER",           sub:"—",           ft: 3.5},
  {n:"03", src:"lid03.png", word:"GAS",             sub:"—",           ft: 9.0},
  {n:"04", src:"lid04.png", word:"C.A.S.",          sub:"USA",         ft:12.0},
  {n:"05", src:"lid05.png", word:"GAS",             sub:"—",           ft:17.0},
  {n:"06", src:"lid06.png", word:"VALVCO G.S.",     sub:"VENTI-BOX",   ft:21.5},
  {n:"07", src:"lid07.png", word:"G.S.",            sub:"—",           ft:28.0},
  {n:"08", src:"lid08.png", word:"WATER",           sub:"—",           ft:31.0},
  {n:"09", src:"lid09.png", word:"VENTI-BOX",       sub:"PATENT",      ft:38.0}
];
const N = LIDS.length, SPAN = 40;

/* --------------------------------------------------------------- the strip */
const strip = document.getElementById("strip");
const tagEl = document.getElementById("focusTag");
const nodes = [];

let BIG = 420, STEP = 140, REST = 70;
let pos = 0, target = 0, k = 0, kWant = 0, hovered = -1;
let dragging = false, startX = 0, startPos = 0, moved = 0;
const GHOST = 0.155;

/* engaging from rest is quick; swapping to another lid has to be deliberate */
const DWELL_IN = 70, DWELL_SWAP = 170, GRACE = 150;
let over = -1, enterT = null, leaveT = null;
function release(){
  over = -1;
  clearTimeout(enterT); clearTimeout(leaveT);
  leaveT = setTimeout(()=>{ if(over < 0){ hovered = -1; kWant = 0; } }, GRACE);
}

for(let i=0;i<N;i++){
  const b = document.createElement("button");
  b.className = "lid";
  b.setAttribute("aria-label", "Specimen " + LIDS[i].n + ", " + LIDS[i].word);
  const im = new Image();
  im.alt = "";
  im.src = LIDS[i].src;
  b.appendChild(im);
  strip.appendChild(b);
  nodes.push(b);

  b.addEventListener("pointerenter", ()=>{
    if(dragging || openIdx >= 0) return;
    over = i;
    clearTimeout(leaveT);
    if(hovered === i) return;
    clearTimeout(enterT);
    const wait = (hovered >= 0 && k > 0.4) ? DWELL_SWAP : DWELL_IN;
    enterT = setTimeout(()=>{            // settle on it; sweeping past does nothing
      if(over === i && !dragging && openIdx < 0){
        hovered = i; kWant = 1; target = pos + wrapDelta(i - pos);
      }
    }, wait);
  });
  b.addEventListener("pointerleave", ()=>{ if(over === i) release(); });
  b.addEventListener("focus", ()=>{
    if(openIdx < 0){ hovered = i; kWant = 1; target = pos + wrapDelta(i - pos); }
  });
  b.addEventListener("blur",  ()=>{ if(hovered === i){ over = -1; hovered = -1; kWant = 0; } });
  // Keyboard only. A real click never reaches here: the strip captures the
  // pointer for dragging, and a captured sequence delivers its click to the
  // capturing element, not to the button under it. Taps are handled in
  // endDrag instead. A keyboard-activated click has detail 0.
  b.addEventListener("click", (ev)=>{ if(ev.detail === 0) openRecord(i); });
}
strip.addEventListener("pointerleave", release);

/* the row is a ring: shortest way round from pos to i */
function wrapDelta(d){
  d = ((d % N) + N) % N;
  return d > N/2 ? d - N : d;
}
function restX(u){ return u * STEP; }   /* at rest: evenly spaced */
function hotX(u){
  const A = BIG * 0.56, B = BIG * 0.155;
  const d = Math.abs(u), s = u < 0 ? -1 : 1;
  return d <= 1 ? u * A : s * (A + (d - 1) * B);
}
function hotScale(d){
  return d <= 1 ? GHOST + (1 - GHOST) * Math.pow(1 - d, 1.5) : GHOST * Math.pow(0.86, d - 1);
}
function hotAlpha(d){
  return d <= 1 ? 0.42 + 0.58 * (1 - d) : Math.max(0.10, 0.42 * Math.pow(0.78, d - 1));
}

function sizeStrip(){
  const w = strip.clientWidth, h = strip.clientHeight;
  if(!w || !h) return;
  BIG  = Math.max(150, Math.min(w * 0.58, h * 0.80));
  STEP = Math.min((w * 0.88) / (N - 1), BIG * 0.34);
  REST = Math.max(34, Math.min(BIG * 0.26, STEP * 0.82, h * 0.32));
  nodes.forEach(b=>{
    b.style.width  = BIG + "px";
    b.style.height = BIG + "px";
    b.style.marginLeft = (-BIG/2) + "px";
    b.style.marginTop  = (-BIG/2) + "px";
  });
}

/* ═══════════════════════════════════════ what the block has lost so far
   Until now the record reset every time it was closed. The text says so
   itself: "Closing a record and opening it again gives you back a whole
   print, which is the one lie the piece tells." This is the lie being
   taken out.

   Each lid carries an accumulated figure, 0 to 1. A record opens at that
   figure and your reading takes it from there toward nothing; when you
   leave, a small part of what you read away is added to the figure and
   kept. Nobody's single visit does much. Everybody's visits do.

   Three places it can be kept, in order of how shared it is:

     1 · an endpoint of your own  — truly shared, everyone adds to it,
         works on GitHub Pages. Off until WEAR_ENDPOINT is set.
     2 · the artifact's own store — shared among whoever can write to the
         artifact. Outside visitors read the worn state but cannot add to
         it, which is a limit of the platform, not of the idea.
     3 · this browser            — always available. The wear is yours
         alone, but it does not reset, which is already the end of the lie.

   Whichever answers first wins. The page renders at 0 and darkens into
   the real figure when it arrives, so nothing waits on the network. */
const WEAR_ENDPOINT = "";

const Block = (function(){
  const KEY   = "underfoot.wear.v2";
  const SHARE = 0.045;    // one whole read-through takes this much of what is left
  const GONE  = 0.88;     // past here nobody can make it out any more

  /* Three numbers per lid.
       a — how much ink this casting has lost, 0 to 1
       n — how many times it has been opened, ever
       g — which casting this is. 1 is the one Mark printed.

     A lid that crosses GONE is not held there. It is DUG UP AND REPLACED,
     which is what the street does and what record 08 already says it does:
     "Somebody will dig it up and put a new one in." So a lies back down at
     0, g goes up by one, and the next visitor finds a lid at full ink in
     that position with no sign that anything happened — which is also what
     the street does. n keeps counting across castings: the position is
     older than any lid in it. */
  const A = new Array(N).fill(0);
  const Nn = new Array(N).fill(0);
  const G = new Array(N).fill(1);
  const listeners = [];
  let col = null, remote = false;

  const clip = v => v < 0 ? 0 : (v > 1 ? 1 : v);
  const id   = i => (i + 1 < 10 ? "0" : "") + (i + 1);
  const fire = () => { for(const f of listeners){ try{ f(); }catch(e){} } };

  function take(o){
    let hit = false;
    for(let i = 0; i < N; i++){
      const r = o[id(i)];
      if(r == null) continue;
      const v = (typeof r === "object") ? r : { a: r };
      if(isFinite(+v.a)){ A[i] = clip(+v.a); hit = true; }
      if(isFinite(+v.n)) Nn[i] = Math.max(0, +v.n | 0);
      if(isFinite(+v.g)) G[i]  = Math.max(1, +v.g | 0);
    }
    return hit;
  }
  function pack(){
    const o = {};
    for(let i = 0; i < N; i++) o[id(i)] = { a: +A[i].toFixed(4), n: Nn[i], g: G[i] };
    return o;
  }
  function readLocal(){ try{ const r = localStorage.getItem(KEY); if(r) take(JSON.parse(r)); }catch(e){} }
  function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(pack())); }catch(e){} }

  async function connect(){
    readLocal(); fire();
    if(WEAR_ENDPOINT){
      try{
        const r = await fetch(WEAR_ENDPOINT, { cache: "no-store" });
        if(r.ok && take(await r.json())){ remote = true; writeLocal(); fire(); }
      }catch(e){}
      if(remote) return;
    }
    if(!(window.claude && window.claude.use)) return;
    let db = null;
    try{ db = await claude.use("db"); }catch(e){}
    if(!db) return;                       // signed out, or not served
    try{
      col = db.collection("wear");
      col.onSnapshot(snap => {            // other readers, live
        let hit = false;
        snap.docs.forEach(d => {
          const i = parseInt(d.id, 10) - 1;
          if(i < 0 || i >= N || !d.exists) return;
          const v = d.data();
          if(isFinite(+v.a)){ A[i] = clip(+v.a); hit = true; }
          if(isFinite(+v.n)) Nn[i] = +v.n | 0;
          if(isFinite(+v.g)) G[i]  = Math.max(1, +v.g | 0);
        });
        if(hit){ writeLocal(); fire(); }
      }, () => {});
    }catch(e){ col = null; }
  }

  /* One visit: it was opened once, and it lost `give` of what was left.
     Called on the way out of a record, so it is one write per visit. */
  async function visit(i, give){
    if(i < 0 || i >= N) return;
    const add = give > 0.0005 ? give : 0;
    Nn[i] += 1;
    if(A[i] + add >= GONE){ A[i] = 0; G[i] += 1; }   // dug up, replaced
    else A[i] = clip(A[i] + add);
    writeLocal(); fire();

    if(remote){
      try{
        await fetch(WEAR_ENDPOINT, { method: "POST", keepalive: true,
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ lid: id(i), add: +add.toFixed(4) }) });
      }catch(e){}
      return;
    }
    if(!col) return;
    try{
      // read immediately before writing, so two readers at once still add up
      const cur = await col.doc(id(i)).get();
      const d = cur.exists ? cur.data() : {};
      let a = isFinite(+d.a) ? clip(+d.a) : 0;
      let n = isFinite(+d.n) ? (+d.n | 0) : 0;
      let g = isFinite(+d.g) ? Math.max(1, +d.g | 0) : 1;
      n += 1;
      if(a + add >= GONE){ a = 0; g += 1; } else a = clip(a + add);
      await col.doc(id(i)).set({ a: +a.toFixed(4), n: n, g: g });
      A[i] = a; Nn[i] = n; G[i] = g;
      writeLocal(); fire();
    }catch(e){}            // a viewer who cannot write still sees their own
  }

  connect();
  return {
    of:     i => A[i] || 0,
    opens:  i => Nn[i] || 0,
    gen:    i => G[i] || 1,
    share:  SHARE,
    visit:  visit,
    onChange: f => listeners.push(f)
  };
})();

function place(){
  const restScale = REST / BIG;
  for(let i=0;i<N;i++){
    const u = wrapDelta(i - pos), d = Math.abs(u), b = nodes[i];
    const rx = restX(u), hx = hotX(u);
    const rs = restScale, hs = hotScale(d);
    const ra = (Math.abs(rx) > strip.clientWidth) ? 0 : 1, ha = hotAlpha(d);
    const x = rx + (hx - rx) * k;
    const s = rs + (hs - rs) * k;
    // soften the seam where a lid comes round from the far side
    const seam = Math.max(0, Math.min(1, (N/2 - d) / 0.9));
    // a lid that has been read away stands fainter in the row. At this
    // size grain would not read; less ink would, and does.
    const a = (ra + (ha - ra) * k) * seam * (1 - 0.52 * Block.of(i));
    b.style.transform = "translateX(" + x.toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
    b.style.opacity = a.toFixed(3);
    b.style.zIndex  = String(10 - Math.round(d));
    b.style.pointerEvents = (a < 0.05) ? "none" : "auto";
  }
  const f = focusIndex(), L = LIDS[f];
  tagEl.style.top = "calc(50% + " + (BIG * 0.5 * (restScale + (1 - restScale) * k) + 18) + "px)";
  tagEl.innerHTML = "<em>" + L.word + "</em><i>" + stateOf(f) + "</i>";
  const tagA = Math.max(0, (k - 0.35) / 0.65) * Math.max(0, 1 - Math.abs(wrapDelta(pos - f)) * 2.4);
  tagEl.style.opacity = String(tagA);
  // the arrow and the tag want the same spot at the foot of the row, so
  // they take turns: settle on a lid and the way down steps back
  const cue = document.getElementById("cue");
  if(cue) cue.style.opacity = String(1 - tagA);
}
function focusIndex(){ return ((Math.round(pos) % N) + N) % N; }

/* --------------------------------------------------------- drag and wheel */
function stepPx(){ return STEP * (1 - k) + (BIG * 0.56) * k; }

strip.addEventListener("pointerdown", e=>{
  if(openIdx >= 0) return;
  dragging = true; moved = 0;
  startX = e.clientX; startPos = pos;
  over = -1; clearTimeout(enterT); clearTimeout(leaveT);
  hovered = -1; kWant = 0;
  strip.classList.add("drag");
  try{ strip.setPointerCapture(e.pointerId); }catch(err){}
});
strip.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  pos = clamp(startPos - dx / stepPx());
  target = pos; place();
});
function endDrag(e){
  if(!dragging) return;
  dragging = false;
  strip.classList.remove("drag");
  try{ strip.releasePointerCapture(e.pointerId); }catch(err){}
  target = clamp(Math.round(pos));

  // Barely moved, so it was a tap. A tap on a print opens it — no hover
  // first, no second click, nothing to earn. On a touchscreen there is no
  // hover to earn it with anyway.
  if(moved <= 6){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const btn = el && el.closest ? el.closest(".lid") : null;
    const i = btn ? nodes.indexOf(btn) : -1;
    if(i >= 0) openRecord(i);
  }
}
strip.addEventListener("pointerup", endDrag);
strip.addEventListener("pointercancel", endDrag);

let wheelIdle;
strip.addEventListener("wheel", e=>{
  if(openIdx >= 0) return;
  // Down is down. Only a sideways gesture moves the row — which is the
  // direction the row is in, so nothing has to be explained to anybody.
  if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // the page takes it
  e.preventDefault();
  pos = clamp(pos + e.deltaX / stepPx() * 0.8);
  target = pos; place();
  clearTimeout(wheelIdle);
  wheelIdle = setTimeout(()=>{ target = clamp(Math.round(pos)); }, 130);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && openIdx < 0 && stageEl.scrollTop > 24){
    stageEl.scrollTo({top:0, behavior:"smooth"}); return;
  }
  if(openIdx >= 0){
    if(e.key === "Escape") closeRecord();
    if(e.key === "ArrowLeft")  openRecord((openIdx + N - 1) % N);
    if(e.key === "ArrowRight") openRecord((openIdx + 1) % N);
    return;
  }
  if(e.key === "ArrowLeft"){  target = clamp(Math.round(pos) - 1); e.preventDefault(); }
  if(e.key === "ArrowRight"){ target = clamp(Math.round(pos) + 1); e.preventDefault(); }
});
function clamp(v){ return v; }   /* the ring has no ends */


/* ------------------------------------------- reading wears the lid away
   Progress through the text is the only thing that erodes it. Scroll to the
   end and there is nothing left to look at. */
function rng(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
/* ------------------------------------------ the surface, and what takes it
   One noise field per print, built once and then never touched. Wearing is
   a threshold moving across that field, so a patch that has gone stays gone
   — the loss only ever accumulates, and scrolling back up does not give any
   of it back. The field is equalised first, which means a threshold of p
   removes exactly p of the ink; without that the whole print collapses at
   once somewhere in the middle. The cells are wider than they are tall, so
   the grains come out as flecks rather than dots. */
function octave(w, h, cw, ch, rnd, out, amp){
  const gw = Math.ceil(w / cw) + 2;
  const g = new Float32Array(gw * (Math.ceil(h / ch) + 2));
  for(let i = 0; i < g.length; i++) g[i] = rnd();
  const sm = t => t * t * (3 - 2 * t);
  for(let y = 0; y < h; y++){
    const gy = y / ch, y0 = Math.floor(gy), fy = sm(gy - y0);
    for(let x = 0; x < w; x++){
      const gx = x / cw, x0 = Math.floor(gx), fx = sm(gx - x0);
      const a = g[y0 * gw + x0],       b = g[y0 * gw + x0 + 1];
      const c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];
      const t1 = a + (b - a) * fx, t2 = c + (d - c) * fx;
      out[y * w + x] += (t1 + (t2 - t1) * fy) * amp;
    }
  }
}
function grainField(S, seed){
  const r = rng(seed), f = new Float32Array(S * S), u = S * 0.0030;
  octave(S, S, S * 0.110, S * 0.110, r, f, 0.12);   // which region goes first
  octave(S, S, u * 3.00,  u * 2.10,  r, f, 0.20);   // loose clusters
  octave(S, S, u * 1.15,  u * 0.75,  r, f, 0.37);   // the grains themselves
  octave(S, S, u * 0.50,  u * 0.40,  r, f, 0.31);   // each grain's ragged edge

  let lo = Infinity, hi = -Infinity, i;
  for(i = 0; i < f.length; i++){ if(f[i] < lo) lo = f[i]; if(f[i] > hi) hi = f[i]; }
  const B = 65536, hist = new Uint32Array(B), span = (hi - lo) || 1;
  const bin = new Uint16Array(f.length);
  for(i = 0; i < f.length; i++){
    const k = Math.min(B - 1, ((f[i] - lo) / span * (B - 1)) | 0);
    bin[i] = k; hist[k]++;
  }
  const cdf = new Float32Array(B);
  let acc = 0;
  for(i = 0; i < B; i++){ acc += hist[i]; cdf[i] = acc / f.length; }
  for(i = 0; i < f.length; i++) f[i] = cdf[bin[i]];
  return f;
}
let FIELDS = {}, fieldSize = 0;
function fieldFor(idx, S){
  if(S !== fieldSize){ FIELDS = {}; fieldSize = S; }   // a resize invalidates them all
  const key = "k" + idx;
  if(!FIELDS[key]) FIELDS[key] = grainField(S, 9001 + idx * 77);
  return FIELDS[key];
}

function paintLid(cv, idx, cssPx, p){
  const img = nodes[idx] && nodes[idx].firstChild;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = Math.round(cssPx * dpr);
  if(cv.width !== S){ cv.width = S; cv.height = S; }
  cv.style.width  = cssPx + "px";
  cv.style.height = "auto";          // never a fixed height — see .lidcol canvas

  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, S, S);
  if(!img || !img.complete) return;

  const off = document.createElement("canvas");
  off.width = S; off.height = S;
  const o = off.getContext("2d", { willReadFrequently: true });
  o.drawImage(img, 0, 0, S, S);

  if(p > 0){
    const F = fieldFor(idx, S);
    const im = o.getImageData(0, 0, S, S), d = im.data;
    const thr = 1 - p, soft = 0.010;    // a hard edge: a grain of ink is there or it is not
    for(let i = 0, px = 0; i < d.length; i += 4, px++){
      const a = d[i + 3];
      if(a === 0) continue;
      const n = F[px];
      if(n > thr + soft) d[i + 3] = 0;
      else if(n > thr)   d[i + 3] = a * (1 - (n - thr) / soft);
    }
    o.putImageData(im, 0, 0);
  }

  ctx.drawImage(off, 0, 0);
}

/* -------------------------------------------------------------- the record */
const stageEl = document.querySelector(".stage");
const recEl  = document.getElementById("record");
const textEl = document.getElementById("textcol");
const bigCv  = document.getElementById("big");
let openIdx = -1, lidSize = 420, readP = 0, rafPending = false;
/* How much ink this record has lost so far. It is a high-water mark, not a
   reading of where you are: the lid does not get its letters back because
   you scrolled up, any more than the block gives them back by standing
   still. Closing the record and opening it again is the only reset, and
   that reset is a lie the piece tells on purpose. */
let wornSeen = 0, seenP = 0;
/* where this record stood when it opened — everyone else's reading, already
   done, before you touched it */
let lidBase = 0;
/* ═══════════════════════════════════════════════════ scattering the record
   A curb box is not placed by a designer. It is placed where the pipe comes
   up, and the pipe was routed by somebody who never saw this sidewalk. So
   the nine of them land across the block in no order at all — and yet every
   single one is a perfect circle, set dead flush with the pavement.

   That is exactly the rule here. WHERE a fragment lands is random. HOW it
   lands is not: it starts on one of the twelve tracks, never between them,
   and the gap under it is a whole number of units, never a loose value.
   Random placement, exact fit. Scatter without slop.

   The scatter is seeded from the lid's own number, so record 03 is laid out
   differently from record 07 and neither of them ever moves again. Reload
   it, come back next week — the fragments are where they were. Nobody
   chose it, and it is not going to change, which is the condition the lids
   themselves are in.                                                      */
function layoutFor(seed, count){
  const r = rng(seed);
  const pick = a => a[(r() * a.length) | 0];

  /* The tracks a fragment may start on, weighted: most things want to be
     near the margin, a few want to be a long way in. An even spread would
     put everything in the middle, which is the one place nothing should be. */
  const STARTS  = [1,1,1,1,2,2,3,3,4,5,6,7,8];
  const SPANS   = [4,4,4,5,5,6,7];
  const GAPS    = [3,3,4,5,6,8];

  /* each record breathes at its own rate — some blocks are crowded */
  const air = 0.80 + r() * 0.55;

  const out = [];
  let runC = 0, lastC = -1, lastFlush = -1, tight = false;

  for(let i = 0; i < count; i++){
    if(i === 0){
      // The record still opens at the margin, with room under it — but it
      // opens in the same voice as everything else. The opening sentence is
      // not a headline; it is the first thing said, and nothing about a
      // worn lid is announced.
      out.push({ c: 1, sp: 7, g: Math.round(7 * air), v: "pivot" });
      lastC = 1; continue;
    }

    /* ── which voice the slot is willing to carry ── decided first, because
       a turn set three tracks wide is not a turn, it is a column of rubble */
    const v = r() < 0.34 ? "pivot" : "body";

    /* ── how wide ── every voice has a measure it can actually hold */
    const sp = v === "pivot" ? 5 + ((r() * 3) | 0) : pick(SPANS);

    /* ── where ── anywhere on the grid that leaves room for the measure.
       The fragment is never allowed to run off the end and be squeezed:
       a lid set half into the kerb is a lid somebody installed wrong. */
    let c;
    for(let k = 0; k < 24; k++){
      c = Math.min(pick(STARTS), 13 - sp);
      if(c === lastC && runC >= 2) continue;        // no third in a column
      if(Math.abs(c - lastC) === 1 && r() < 0.6) continue;  // a one-track nudge
      break;                                        //   reads as a mistake
    }
    c = Math.max(1, Math.min(c, 13 - sp));
    runC = (c === lastC) ? runC + 1 : 1;
    lastC = c;

    /* ── how far down ── a tight pair happens when it happens, but one
       tight gap is a pair and three in a row is a paragraph */
    let g;
    if(!tight && r() < 0.30){ g = 2; tight = true; }
    else { g = pick(GAPS); if(tight) g = Math.max(g, 5); tight = false; }
    g = Math.max(2, Math.round(g * air));

    /* ── and whether it turns against the right edge ── never twice near
       each other, or the hard edge stops being an event */
    const flush = v === "pivot" && c >= 4 && (i - lastFlush) > 4 && r() < 0.55;
    if(flush) lastFlush = i;

    out.push({ c: c, sp: sp, g: g, v: v, flush: flush });
  }
  return out;
}

/* The voice is finally decided by the sentence. A slot can ask for a pivot,
   but a sentence seventeen words long is not a pivot however it is set; and
   a four-word sentence sitting in a body slot is wasted as body. Letting the
   writing overrule the grid is what keeps the hierarchy honest. */
function voiceFor(slot, text, i){
  const n = text.length;
  if(slot.v === "pivot") return n <= 90 ? "pivot" : "body";
  if(n <= 58) return "pivot";
  return "body";
}

/* Reading is slow at first and the lid holds. The loss accelerates toward
   the end, so most of the record is still legible while you are still
   reading it — the print should outlast the first two sentences, not the
   first paragraph. */
function wearAt(p){ return Math.pow(p, 1.9); }

/* ──────────────────────────────────────────────────────── the nine settings
   side : which side of the page the print is set into
   vt   : where it sits in the height of the screen
   k    : how much of the column it fills
   x    : a nudge across the column, as a percentage of the print itself

   Chosen rather than drawn at random, because nine is a small enough number
   that a random draw would just happen to put six of them on the left. The
   scatter in the text can afford to be blind. The nine positions cannot. */
const PLACE = [
  { side: "l", vt: "c", k: 1.00, x:   0 },
  { side: "r", vt: "t", k: 0.86, x:   6 },
  { side: "l", vt: "b", k: 0.92, x:  -7 },
  { side: "r", vt: "c", k: 0.99, x:   0 },
  { side: "l", vt: "t", k: 0.81, x:  10 },
  { side: "r", vt: "b", k: 0.88, x:  -6 },
  { side: "l", vt: "c", k: 0.95, x: -11 },
  { side: "r", vt: "t", k: 0.93, x:   9 },
  { side: "l", vt: "b", k: 0.84, x:   4 }
];

function lidBox(){
  const w = window.innerWidth, h = window.innerHeight;
  // Measure the column the print actually sits in, not the window. The
  // specimen grid is capped at 1500px and padded, so on a wide screen
  // 40% of the viewport is wider than the column and the print was being
  // squeezed sideways to fit.
  const col = document.querySelector(".lidcol");
  const cw = col ? col.clientWidth : w * 0.40;
  const k  = (PLACE[openIdx] || PLACE[0]).k;
  return w > 820 ? Math.min(cw * 0.94, h * 0.74) * k
                 : Math.min(cw, w * 0.68, h * 0.36) * (0.86 + k * 0.14);
}

function openRecord(i){
  commitWear();                     // whatever the last record lost, keep it
  openIdx = i; over = -1; hovered = -1;
  lidBase = Block.of(i);
  clearTimeout(enterT); clearTimeout(leaveT);
  target = pos = pos + wrapDelta(i - pos);
  strip.classList.add("gone");
  if(stageEl) stageEl.scrollTop = 0;   // close, and you are back at the row
  recEl.classList.add("on");

  // set the print into the page — once, before anything is drawn
  const pl = PLACE[i] || PLACE[0];
  recEl.classList.remove("side-r", "vt-t", "vt-b");
  if(pl.side === "r") recEl.classList.add("side-r");
  if(pl.vt !== "c")   recEl.classList.add("vt-" + pl.vt);
  bigCv.style.setProperty("--lx", pl.x);

  const L = LIDS[i];
  // No name, no number, no material. A specification sheet here would only
  // reassure you that somebody has this under control. The record is the
  // wearing itself, so the only thing on the page is what is being read away.
  const frags = LINES[L.n] || [];
  // seeded from the lid, so this record's scatter is this record's forever
  const slots = layoutFor(4517 + i * 193, frags.length);
  let html = "";
  frags.forEach(function(t, j){
    const s = slots[j];
    const v = voiceFor(s, t, j);

    html += "<p class='line l-" + v + (s.flush && v === "pivot" ? " flush" : "") +
            "' style='--c:" + s.c + ";--sp:" + s.sp + ";--g:" + s.g + "'>" +
            t + "</p>";
  });
  textEl.innerHTML = html;

  recEl.scrollTop = 0;
  recEl.style.setProperty("--r", "0");
  measureFade();                 // a new record opens at full ink
  recEl.classList.remove("late");
  readP = 0; seenP = 0; wornSeen = lidBase;
  lidSize = lidBox();
  paintLid(bigCv, i, lidSize, lidBase);
}

/* ── fading the fragments you have finished with ──────────────────────────
   Measured once when the record opens, so the scroll handler never asks the
   page for a layout. A fragment starts going when its top passes the line
   you read at, and is most of the way gone a screen and a half later.

   The value only ever goes up. Scroll back and the sentence is still pale —
   the same rule the print has had from the start. You cannot un-read it any
   more than the block can un-walk on the iron. */
let fadeEls = [], fadeTop = [], fadeNow = [];
function fadeTops(){
  // position inside the record's scroll content, measured the same way no
  // matter which element happens to be the offset parent at this width
  const base = recEl.getBoundingClientRect().top - recEl.scrollTop;
  return fadeEls.map(el => el.getBoundingClientRect().top - base);
}
function measureFade(){
  fadeEls = Array.prototype.slice.call(textEl.querySelectorAll(".line"));
  fadeTop = fadeTops();
  fadeNow = fadeEls.map(() => 0);
}
function applyFade(){
  const read = recEl.scrollTop + recEl.clientHeight * 0.52;   // where the eye is
  const span = recEl.clientHeight * 1.45;                     // how long it takes
  for(let i = 0; i < fadeEls.length; i++){
    let f = (read - fadeTop[i]) / span;
    if(f < 0) f = 0; else if(f > 1) f = 1;
    if(f <= fadeNow[i] + 0.015) continue;      // never back, and never for nothing
    fadeNow[i] = f;
    fadeEls[i].style.setProperty("--f", f.toFixed(2));
  }
}

function onRead(){
  if(openIdx < 0) return;
  const max = recEl.scrollHeight - recEl.clientHeight;
  const p = max > 0 ? Math.max(0, Math.min(1, recEl.scrollTop / max)) : 0;
  if(Math.abs(p - readP) < 0.004) return;      // redraw in steps, not every pixel
  readP = p;
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    // you take it from where the block left it, not from whole
    const w = lidBase + (1 - lidBase) * wearAt(readP);
    if(w > wornSeen) wornSeen = w;
    paintLid(bigCv, openIdx, lidSize, wornSeen);
    // the layout lets go on the same high-water mark, so the page cannot
    // reassemble itself behind you either
    if(readP > seenP) seenP = readP;
    recEl.style.setProperty("--r", seenP.toFixed(3));
    recEl.classList.toggle("late", seenP > 0.74);
    applyFade();
  });
}
recEl.addEventListener("scroll", onRead, {passive:true});

/* A visit gives back a fraction of what it read away. Called on the way
   out of a record, however you leave it. */
function commitWear(){
  if(openIdx < 0) return;
  Block.visit(openIdx, (1 - lidBase) * wearAt(seenP) * Block.share);
}
window.addEventListener("pagehide", commitWear);
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") commitWear();
});

function closeRecord(){
  commitWear();
  openIdx = -1; kWant = 0;
  recEl.classList.remove("on");
  strip.classList.remove("gone");
  place();
}
document.getElementById("prev").onclick  = ()=>openRecord((openIdx + N - 1) % N);
document.getElementById("next").onclick  = ()=>openRecord((openIdx + 1) % N);
document.getElementById("close").onclick = closeRecord;

/* when the figure arrives, or another reader moves it, the row restates
   itself — but never under an open record, which has its own copy */
Block.onChange(()=>{ if(openIdx < 0) place(); ledger(); });

/* ───────────────────────────────────────────────── keeping the record
   Two readouts, both in the voice of a works schedule rather than a
   dashboard. One line per lid, under its name, when you settle on it;
   one line for the whole block, at the foot of the page. Neither says
   "views" and neither has a chart. */
function stateOf(i){
  const g = Block.gen(i);
  let s = "VIEWS " + Block.opens(i);
  if(g > 1) s += "  ·  CASTING " + g;        // this is not the lid he printed
  return s;
}

const ledgerEl = document.getElementById("ledger");
function ledger(){
  if(!ledgerEl) return;
  let n = 0, replaced = 0;
  for(let i = 0; i < N; i++){ n += Block.opens(i); replaced += Block.gen(i) - 1; }
  ledgerEl.textContent = n + " views  ·  " + replaced +
                         (replaced === 1 ? " lid replaced" : " lids replaced");
}
ledger();

/* ?wear in the address bar prints the nine figures, for looking at the
   block's state without reading it away */
if(location.search.indexOf("wear") >= 0){
  const report = ()=>{
    const rows = [];
    for(let i = 0; i < N; i++){
      rows.push({
        lid: LIDS[i].n,
        word: LIDS[i].word,
        "ink lost": (Block.of(i) * 100).toFixed(1) + "%",
        opened: Block.opens(i),
        casting: Block.gen(i) === 1 ? "original" : "no." + Block.gen(i),
      });
    }
    console.table(rows);
  };
  setTimeout(report, 1600);
  Block.onChange(()=>{ clearTimeout(window.__wr); window.__wr = setTimeout(report, 400); });
}

/* ------------------------------------------------------ the block, heard
   Nothing is sampled. A low bed of traffic, footsteps that come near and go
   away again, and the occasional car at the end of the street — all synthesised,
   so the page carries no audio files. */
const Ambient = (function(){
  let ctx = null, master = null, noise = null, running = false;
  const timers = [];

  function makeNoise(seconds){
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<n;i++){                       // brown-ish: warmer than white
      const w = Math.random()*2 - 1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.2;
    }
    return buf;
  }

  function bed(){                                // distant traffic, always there
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = 0.6;
    const g = ctx.createGain(); g.gain.value = 0.16;
    src.connect(lp).connect(g).connect(master);
    src.start();

    // the hum breathes rather than sits still
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = 0.045; lfoG.gain.value = 90;
    lfo.connect(lfoG).connect(lp.frequency);
    lfo.start();
  }

  function step(when, gain, pan){
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(pn) pn.pan.value = pan;
    const out = pn || ctx.createGain();
    out.connect(master);

    // the scuff: a short band of noise
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500 + Math.random()*900;
    bp.Q.value = 0.9 + Math.random()*0.6;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0, when);
    g1.gain.linearRampToValueAtTime(gain * 0.5, when + 0.004);
    g1.gain.exponentialRampToValueAtTime(0.0001, when + 0.075 + Math.random()*0.03);
    src.connect(bp).connect(g1).connect(out);
    src.start(when); src.stop(when + 0.2);

    // the weight: a short low thump under it
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(96 + Math.random()*28, when);
    osc.frequency.exponentialRampToValueAtTime(52, when + 0.09);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, when);
    g2.gain.linearRampToValueAtTime(gain * 0.42, when + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.11);
    osc.connect(g2).connect(out);
    osc.start(when); osc.stop(when + 0.25);
  }

  /* someone walks past: near, then further, then gone, then someone else */
  let prox = 0.3, pan = 0, pace = 0.52, leftFoot = true;
  function walk(){
    if(!running) return;
    const t = ctx.currentTime + 0.03;
    const gain = 0.05 + 0.5 * prox * prox;
    step(t, gain * (leftFoot ? 1 : 0.88), pan + (leftFoot ? -0.07 : 0.07));
    leftFoot = !leftFoot;

    prox = Math.max(0.02, Math.min(1, prox + (Math.random()-0.5)*0.12));
    pan  = Math.max(-0.8, Math.min(0.8, pan + (Math.random()-0.5)*0.1));

    let wait = pace * (0.93 + Math.random()*0.14);
    if(Math.random() < 0.05){            // they are gone; the street is empty a while
      wait += 2.5 + Math.random()*5;
      prox = 0.05 + Math.random()*0.25;
      pan  = (Math.random()*2 - 1) * 0.7;
      pace = 0.46 + Math.random()*0.16;
    }
    timers.push(setTimeout(walk, wait*1000));
  }

  function car(){                        // one passing at the end of the block
    if(!running) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(190, t);
    bp.frequency.linearRampToValueAtTime(620, t + 2.2);
    bp.frequency.linearRampToValueAtTime(170, t + 5.0);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t + 2.0);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5.2);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 5.4);
    timers.push(setTimeout(car, (11 + Math.random()*22) * 1000));
  }

  function start(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      noise = makeNoise(3);
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      bed();
    }
    if(ctx.state === "suspended") ctx.resume();
    running = true;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 2.2);   // fades up
    walk();
    timers.push(setTimeout(car, 4000));
    return true;
  }

  function stop(){
    running = false;
    while(timers.length) clearTimeout(timers.pop());
    if(!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
  }

  return { start, stop };
})();

/* Browsers hold audio until the visitor has touched the page, so the street
   starts itself on whatever they do first — a move, a click, a key. */
let soundStarted = false;
function wakeSound(){
  if(soundStarted) return;
  soundStarted = Ambient.start();
  if(soundStarted){
    ["pointerdown","pointermove","keydown","wheel","touchstart"]
      .forEach(ev => window.removeEventListener(ev, wakeSound));
  }
}
["pointerdown","pointermove","keydown","wheel","touchstart"]
  .forEach(ev => window.addEventListener(ev, wakeSound, {passive:true}));

document.addEventListener("visibilitychange", ()=>{
  if(!soundStarted) return;
  if(document.hidden) Ambient.stop(); else Ambient.start();
});

/* -------------------------------------------------------------------- loop */
let last = 0, ready = false;
function frame(t){
  const dt = last ? Math.min(0.1, (t - last)/1000) : 0;
  last = t;
  if(ready){
    let moving = false;
    if(Math.abs(kWant - k) > 0.0008){ k += (kWant - k) * Math.min(1, dt * 7.5); moving = true; }
    else if(k !== kWant){ k = kWant; moving = true; }
    if(!dragging && Math.abs(target - pos) > 0.0008){ pos += (target - pos) * Math.min(1, dt * (k > 0.5 ? 4.8 : 8.5)); moving = true; }
    if(moving) place();
  }
  requestAnimationFrame(frame);
}

function boot(){ sizeStrip(); place(); }
let rt;
window.addEventListener("resize", ()=>{
  if(!ready) return;
  clearTimeout(rt);
  rt = setTimeout(()=>{
    boot();
    if(openIdx >= 0){
      lidSize = lidBox();
      paintLid(bigCv, openIdx, lidSize, wornSeen);
      // the fragments have moved; re-measure, but keep what they have lost
      fadeTop = fadeTops();
      applyFade();
    }
  }, 140);
});

Promise.all(nodes.map(b=>{
  const im = b.firstChild;
  return im.complete ? Promise.resolve() : new Promise(r=>{ im.onload = r; im.onerror = r; });
})).then(()=>{
  ready = true;
  document.getElementById("boot").classList.add("gone");
  boot();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
});
requestAnimationFrame(frame);

})();
