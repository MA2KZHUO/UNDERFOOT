<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{ color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body{ margin:0; font:14px/1.5 system-ui, sans-serif; background:#F6F4EF; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
<title>Underfoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">

<style>
/* Layout: at rest the nine relief prints sit at their spacing along the block —
   small, flat, nothing happening. Hover one and it fills the screen while the
   others fall back to ghosts. Click it for the record. */
:root{
  --paper:#F6F4EF;
  --ink:#131211;
  --rule:#DCD8D0;
  --soft:#5E5A53;
  --grey:#A8A29A;
  --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Space Mono','Courier New',ui-monospace,monospace;
  color-scheme: light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}

.frame{position:fixed; inset:0; display:flex; flex-direction:column}

.topbar{
  flex:0 0 auto;
  padding-inline:clamp(16px,4vw,48px);
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--grey);
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  position:relative; z-index:20; pointer-events:none;
}
.topbar{padding-block:clamp(14px,3vh,26px) 0}
.topbar b{color:var(--ink); font-weight:700; letter-spacing:.2em}

.stage{flex:1 1 auto; position:relative; min-height:0; overflow:hidden;
       padding-bottom:clamp(14px,3vh,26px)}

#strip{position:absolute; inset:0; cursor:grab; touch-action:pan-y}
#strip.drag{cursor:grabbing}
#strip.gone{opacity:0; pointer-events:none; transition:opacity .4s}

.lid{
  position:absolute; left:50%; top:50%;
  border:0; padding:0; margin:0; background:none;
  transform-origin:center center; will-change:transform,opacity;
  line-height:0; cursor:pointer;
}
.lid img{display:block; width:100%; height:100%; pointer-events:none}
.lid:focus-visible{outline:2px solid var(--ink); outline-offset:10px}

#focusTag{
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  color:var(--grey); white-space:nowrap; text-align:center;
  pointer-events:none; z-index:12; line-height:1.7; opacity:0;
}
#focusTag em{font-style:normal; color:var(--ink); letter-spacing:.18em}

#boot{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--grey);
  transition:opacity .4s;
}
#boot.gone{opacity:0; pointer-events:none}

#record{
  position:absolute; inset:0; z-index:30;
  background:var(--paper);
  overflow-y:auto; overscroll-behavior:contain;
  opacity:0; pointer-events:none; transition:opacity .35s;
}
#record.on{opacity:1; pointer-events:auto}

.specimen{
  display:grid; grid-template-columns:46% 54%;
  max-width:1500px; margin:0 auto;
  padding-inline:clamp(16px,5vw,64px);
}
.lidcol{
  position:sticky; top:0; height:100vh;
  display:grid; place-items:center;
}
.lidcol canvas{display:block; max-width:100%}
.textcol{padding-block:38vh 62vh; padding-left:clamp(20px,5vw,80px)}

.textcol h2{
  font-family:var(--mono); font-size:11px; font-weight:400;
  letter-spacing:.2em; color:var(--grey); text-transform:uppercase;
  margin:0 0 20px; padding-bottom:14px; border-bottom:1px solid var(--rule);
}
.data{
  font-family:var(--mono); font-size:12px; line-height:2;
  margin:0 0 56vh; display:grid; grid-template-columns:auto 1fr; gap:0 20px;
}
.data dt{color:var(--grey); letter-spacing:.1em}
.data dd{margin:0; font-variant-numeric:tabular-nums}

.textcol .line{
  font-size:clamp(20px,2.3vw,30px); font-weight:300; line-height:1.35;
  margin:0 0 58vh; max-width:18ch; text-wrap:balance; color:var(--ink);
}
.textcol .last{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  color:var(--grey); margin:0; text-transform:uppercase;
}

/* ---------------------------------------------- the layout comes apart too
   --r is the read position: 0 at the top of the record, 1 at the end. The
   same number that erases the print also lets go of the grid. The columns
   drift apart, the archive furniture fades, the sentences grow. A page that
   kept its composure here would be arguing against itself. */
.lidcol{
  transform:translateX(calc(var(--r,0) * -46%));
  opacity:calc(1 - var(--r,0) * 0.18);
}
.textcol{ transform:translateX(calc(var(--r,0) * -21%)); }
.textcol h2{ opacity:max(0, calc(1 - var(--r,0) * 3.2)); }
.data{ opacity:max(0, calc(1 - var(--r,0) * 2.6)); }
.textcol .line{
  font-size:calc(clamp(20px,2.3vw,30px) * (1 + var(--r,0) * 1.15));
  max-width:calc(18ch + var(--r,0) * 13ch);
  transform:translateX(calc(var(--r,0) * var(--d,0) * 1px));
}
/* past three quarters there is no column left to belong to */
#record.late .textcol .line{ max-width:26ch }
#record.late .textcol .last{ text-align:center }

@media (max-width:820px){
  .specimen{grid-template-columns:1fr}
  .lidcol{height:44vh; top:0; background:var(--paper); z-index:1}
  .textcol{padding-left:0; padding-block:12vh 60vh}
  .textcol .line{margin-bottom:52vh; max-width:none}
  .data{margin-bottom:46vh}
  /* one column already — nothing to drift away from */
  .lidcol,.textcol,.textcol .line{transform:none}
  #record.late .textcol .line{max-width:none}
}

.nav{
  position:absolute; top:50%; transform:translateY(-50%);
  background:none; border:0; cursor:pointer; padding:16px 14px;
  font-family:var(--mono); font-size:16px; color:var(--grey);
}
.nav:hover{color:var(--ink)}
.nav:focus-visible{outline:2px solid var(--ink)}
#prev,#next{position:fixed}
#prev{left:clamp(4px,2vw,24px)} #next{right:clamp(4px,2vw,24px)}

#close{
  position:absolute; top:clamp(12px,3vh,26px); right:clamp(16px,4vw,48px);
  background:none; border:0; cursor:pointer; padding:6px 2px;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--grey);
}
#close:hover{color:var(--ink)}

.topbar .links{display:flex; gap:20px}
.link{
  pointer-events:auto;
  font:inherit; letter-spacing:.16em; color:var(--grey);
  background:none; border:0; padding:2px 0; cursor:pointer;
  border-bottom:1px solid transparent;
}
.link:hover{color:var(--ink); border-bottom-color:var(--rule)}
.link:focus-visible{outline:1px solid var(--ink); outline-offset:3px}

#page{
  position:fixed; inset:0; z-index:40;
  background:var(--paper); overflow-y:auto;
  padding:clamp(28px,7vh,80px) clamp(16px,6vw,64px) clamp(40px,8vh,90px);
}
#page .sheet{max-width:58ch; margin:0 auto}
#page h2{
  font-family:var(--mono); font-size:11px; font-weight:400;
  letter-spacing:.2em; color:var(--grey); text-transform:uppercase;
  margin:0 0 28px; padding-bottom:14px; border-bottom:1px solid var(--rule);
}
#page p{
  font-size:clamp(16px,1.5vw,19px); font-weight:300; line-height:1.65;
  margin:0 0 1.25em; color:var(--ink);
}
#page p:last-child{margin-bottom:0}
#page dl{
  font-family:var(--mono); font-size:12px; line-height:1.9; margin:0;
  display:grid; grid-template-columns:minmax(9em,auto) 1fr; gap:4px 24px;
}
#page dt{color:var(--grey); letter-spacing:.1em}
#page dd{margin:0}
#page .rule{height:1px; background:var(--rule); margin:26px 0; grid-column:1/-1}
#page a{color:var(--ink); text-underline-offset:3px}
#pageClose{
  position:fixed; top:clamp(12px,3vh,26px); right:clamp(16px,4vw,48px);
  background:none; border:0; cursor:pointer; padding:6px 2px; z-index:41;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--grey);
}
#pageClose:hover{color:var(--ink)}


@media (prefers-reduced-motion:reduce){ #record,#boot{transition:none} }
</style>

</head>
<body>
<div class="frame">

  <div class="topbar">
    <span><b>UNDERFOOT</b></span>
    <span class="links">
      <button class="link" data-page="about">ABOUT</button>
      <button class="link" data-page="colophon">COLOPHON</button>
    </span>
  </div>

  <div class="stage">
    <div id="strip"><div id="focusTag"></div></div>
    <div id="boot">LOADING THE PRINTS</div>

    <div id="record">
      <article class="specimen">
        <div class="lidcol"><canvas id="big"></canvas></div>
        <div class="textcol" id="textcol"></div>
      </article>
      <button class="nav" id="prev" aria-label="Previous specimen">&#8592;</button>
      <button class="nav" id="next" aria-label="Next specimen">&#8594;</button>
      <button id="close">CLOSE &#215;</button>
    </div>

  <div id="page" hidden>
    <div class="sheet">
      <h2 id="pageTitle"></h2>
      <div id="pageBody"></div>
    </div>
    <button id="pageClose">CLOSE &#215;</button>
  </div>


</div>

<script>
(function(){
"use strict";

const LIDS = [
  {n:"01", src:"lid01.png", word:"MONITORING WELL", sub:"NOT TO FILL", ft: 0.0},
  {n:"02", src:"lid02.png", word:"WATER",           sub:"—",           ft: 3.5},
  {n:"03", src:"lid03.png", word:"GAS",             sub:"—",           ft: 9.0},
  {n:"04", src:"lid04.png", word:"C.A.S.",          sub:"USA",         ft:12.0},
  {n:"05", src:"lid05.png", word:"GAS",             sub:"—",           ft:17.0},
  {n:"06", src:"lid06.png", word:"VALVCO G.S.",     sub:"VENTI-BOX",   ft:21.5},
  {n:"07", src:"lid07.png", word:"G.S.",            sub:"—",           ft:28.0},
  {n:"08", src:"lid08.png", word:"WATER",           sub:"—",           ft:31.0},
  {n:"09", src:"lid09.png", word:"VENTI-BOX",       sub:"PATENT",      ft:38.0}
];
const N = LIDS.length, SPAN = 40;

/* --------------------------------------------------------------- the strip */
const strip = document.getElementById("strip");
const tagEl = document.getElementById("focusTag");
const nodes = [];

let BIG = 420, STEP = 140, REST = 70;
let pos = 0, target = 0, k = 0, kWant = 0, hovered = -1;
let dragging = false, startX = 0, startPos = 0, moved = 0;
const GHOST = 0.155;

/* engaging from rest is quick; swapping to another lid has to be deliberate */
const DWELL_IN = 70, DWELL_SWAP = 170, GRACE = 150;
let over = -1, enterT = null, leaveT = null;
function release(){
  over = -1;
  clearTimeout(enterT); clearTimeout(leaveT);
  leaveT = setTimeout(()=>{ if(over < 0){ hovered = -1; kWant = 0; } }, GRACE);
}

for(let i=0;i<N;i++){
  const b = document.createElement("button");
  b.className = "lid";
  b.setAttribute("aria-label", "Specimen " + LIDS[i].n + ", " + LIDS[i].word);
  const im = new Image();
  im.alt = "";
  im.src = LIDS[i].src;
  b.appendChild(im);
  strip.appendChild(b);
  nodes.push(b);

  b.addEventListener("pointerenter", ()=>{
    if(dragging || openIdx >= 0) return;
    over = i;
    clearTimeout(leaveT);
    if(hovered === i) return;
    clearTimeout(enterT);
    const wait = (hovered >= 0 && k > 0.4) ? DWELL_SWAP : DWELL_IN;
    enterT = setTimeout(()=>{            // settle on it; sweeping past does nothing
      if(over === i && !dragging && openIdx < 0){
        hovered = i; kWant = 1; target = pos + wrapDelta(i - pos);
      }
    }, wait);
  });
  b.addEventListener("pointerleave", ()=>{ if(over === i) release(); });
  b.addEventListener("focus", ()=>{
    if(openIdx < 0){ hovered = i; kWant = 1; target = pos + wrapDelta(i - pos); }
  });
  b.addEventListener("blur",  ()=>{ if(hovered === i){ over = -1; hovered = -1; kWant = 0; } });
  b.addEventListener("click", ()=>{
    if(moved > 6) return;
    if(k > 0.6 && Math.abs(wrapDelta(pos - i)) < 0.35) openRecord(i);
    else { hovered = i; kWant = 1; target = pos + wrapDelta(i - pos); }
  });
}
strip.addEventListener("pointerleave", release);

/* the row is a ring: shortest way round from pos to i */
function wrapDelta(d){
  d = ((d % N) + N) % N;
  return d > N/2 ? d - N : d;
}
function restX(u){ return u * STEP; }   /* at rest: evenly spaced */
function hotX(u){
  const A = BIG * 0.56, B = BIG * 0.155;
  const d = Math.abs(u), s = u < 0 ? -1 : 1;
  return d <= 1 ? u * A : s * (A + (d - 1) * B);
}
function hotScale(d){
  return d <= 1 ? GHOST + (1 - GHOST) * Math.pow(1 - d, 1.5) : GHOST * Math.pow(0.86, d - 1);
}
function hotAlpha(d){
  return d <= 1 ? 0.42 + 0.58 * (1 - d) : Math.max(0.10, 0.42 * Math.pow(0.78, d - 1));
}

function sizeStrip(){
  const w = strip.clientWidth, h = strip.clientHeight;
  if(!w || !h) return;
  BIG  = Math.max(150, Math.min(w * 0.58, h * 0.80));
  STEP = Math.min((w * 0.88) / (N - 1), BIG * 0.34);
  REST = Math.max(34, Math.min(BIG * 0.26, STEP * 0.82, h * 0.32));
  nodes.forEach(b=>{
    b.style.width  = BIG + "px";
    b.style.height = BIG + "px";
    b.style.marginLeft = (-BIG/2) + "px";
    b.style.marginTop  = (-BIG/2) + "px";
  });
}

function place(){
  const restScale = REST / BIG;
  for(let i=0;i<N;i++){
    const u = wrapDelta(i - pos), d = Math.abs(u), b = nodes[i];
    const rx = restX(u), hx = hotX(u);
    const rs = restScale, hs = hotScale(d);
    const ra = (Math.abs(rx) > strip.clientWidth) ? 0 : 1, ha = hotAlpha(d);
    const x = rx + (hx - rx) * k;
    const s = rs + (hs - rs) * k;
    // soften the seam where a lid comes round from the far side
    const seam = Math.max(0, Math.min(1, (N/2 - d) / 0.9));
    const a = (ra + (ha - ra) * k) * seam;
    b.style.transform = "translateX(" + x.toFixed(2) + "px) scale(" + s.toFixed(4) + ")";
    b.style.opacity = a.toFixed(3);
    b.style.zIndex  = String(10 - Math.round(d));
    b.style.pointerEvents = (a < 0.05) ? "none" : "auto";
  }
  const f = focusIndex(), L = LIDS[f];
  tagEl.style.top = "calc(50% + " + (BIG * 0.5 * (restScale + (1 - restScale) * k) + 18) + "px)";
  tagEl.innerHTML = "<em>" + L.word + "</em>";
  tagEl.style.opacity = String(Math.max(0, (k - 0.35) / 0.65) * Math.max(0, 1 - Math.abs(wrapDelta(pos - f)) * 2.4));
}
function focusIndex(){ return ((Math.round(pos) % N) + N) % N; }

/* --------------------------------------------------------- drag and wheel */
function stepPx(){ return STEP * (1 - k) + (BIG * 0.56) * k; }

strip.addEventListener("pointerdown", e=>{
  if(openIdx >= 0) return;
  dragging = true; moved = 0;
  startX = e.clientX; startPos = pos;
  over = -1; clearTimeout(enterT); clearTimeout(leaveT);
  hovered = -1; kWant = 0;
  strip.classList.add("drag");
  try{ strip.setPointerCapture(e.pointerId); }catch(err){}
});
strip.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  pos = clamp(startPos - dx / stepPx());
  target = pos; place();
});
function endDrag(e){
  if(!dragging) return;
  dragging = false;
  strip.classList.remove("drag");
  try{ strip.releasePointerCapture(e.pointerId); }catch(err){}
  target = clamp(Math.round(pos));
}
strip.addEventListener("pointerup", endDrag);
strip.addEventListener("pointercancel", endDrag);

let wheelIdle;
strip.addEventListener("wheel", e=>{
  if(openIdx >= 0) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(!d) return;
  e.preventDefault();
  pos = clamp(pos + d / stepPx() * 0.8);
  target = pos; place();
  clearTimeout(wheelIdle);
  wheelIdle = setTimeout(()=>{ target = clamp(Math.round(pos)); }, 130);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if(!pageEl.hidden){ if(e.key === "Escape") closePage(); return; }
  if(openIdx >= 0){
    if(e.key === "Escape") closeRecord();
    if(e.key === "ArrowLeft")  openRecord((openIdx + N - 1) % N);
    if(e.key === "ArrowRight") openRecord((openIdx + 1) % N);
    return;
  }
  if(e.key === "ArrowLeft"){  target = clamp(Math.round(pos) - 1); e.preventDefault(); }
  if(e.key === "ArrowRight"){ target = clamp(Math.round(pos) + 1); e.preventDefault(); }
});
function clamp(v){ return v; }   /* the ring has no ends */


/* ------------------------------------------- reading wears the lid away
   Progress through the text is the only thing that erodes it. Scroll to the
   end and there is nothing left to look at. */
function rng(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const BLOBS = LIDS.map((L,i)=>{
  const r = rng(9001 + i*77), a = [];
  for(let k=0;k<3400;k++) a.push([r(), r(), r()]);
  return a;
});

function paintLid(cv, idx, cssPx, p){
  const img = nodes[idx] && nodes[idx].firstChild;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = Math.round(cssPx * dpr);
  if(cv.width !== S){ cv.width = S; cv.height = S; }
  cv.style.width = cv.style.height = cssPx + "px";

  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, S, S);
  if(!img || !img.complete) return;

  const off = document.createElement("canvas");
  off.width = S; off.height = S;
  const o = off.getContext("2d");
  o.drawImage(img, 0, 0, S, S);

  const B = BLOBS[idx], c = S/2;
  const count = Math.round(3400 * Math.pow(p, 1.05));
  o.globalCompositeOperation = "destination-out";
  for(let k=0;k<count && k<B.length;k++){
    const b = B[k];
    const a = b[0]*Math.PI*2;
    const rad = Math.pow(b[1], 0.6) * S * 0.52;
    const size = S * (0.006 + (0.018 + 0.055*p) * b[2]);
    o.beginPath();
    o.arc(c + Math.cos(a)*rad, c + Math.sin(a)*rad, size, 0, Math.PI*2);
    o.fill();
  }
  o.globalCompositeOperation = "source-over";

  // the last stretch takes whatever survived the blobs
  ctx.globalAlpha = p > 0.86 ? Math.max(0, 1 - (p - 0.86) / 0.14) : 1;
  ctx.drawImage(off, 0, 0);
  ctx.globalAlpha = 1;
}

/* -------------------------------------------------------------- the record */
const recEl  = document.getElementById("record");
const textEl = document.getElementById("textcol");
const bigCv  = document.getElementById("big");
let openIdx = -1, lidSize = 420, readP = 0, rafPending = false;
const DRIFT = [-34, 58, -16];        // each sentence leaves the measure its own way

/* Reading is slow at first and the lid holds. The loss accelerates toward
   the end, so most of the record is still legible while you are still
   reading it — the print should outlast the first two sentences, not the
   first paragraph. */
function wearAt(p){ return Math.pow(p, 1.9); }

function lidBox(){
  const w = window.innerWidth, h = window.innerHeight;
  return w > 820 ? Math.min(w * 0.40, h * 0.74) : Math.min(w * 0.68, h * 0.36);
}

function openRecord(i){
  openIdx = i; over = -1; hovered = -1;
  clearTimeout(enterT); clearTimeout(leaveT);
  target = pos = pos + wrapDelta(i - pos);
  strip.classList.add("gone");
  recEl.classList.add("on");

  const L = LIDS[i];
  const rows = [
    ["SPECIMEN", L.n],
    ["FOUND",    "211 Bay 35th St"],
    ["MATERIAL", "cast iron"],
    ["READS",    L.word]
  ];
  textEl.innerHTML =
    "<h2>" + L.word + "</h2>" +
    "<dl class='data'>" + rows.map(r=>"<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>").join("") + "</dl>" +
    (LINES[L.n] || []).map((t,j)=>
      "<p class='line' style='--d:" + DRIFT[j % DRIFT.length] + "'>" + t + "</p>"
    ).join("") +
    "<p class='last'>Nothing further survives on this lid.</p>";

  recEl.scrollTop = 0;
  recEl.style.setProperty("--r", "0");
  recEl.classList.remove("late");
  readP = 0;
  lidSize = lidBox();
  paintLid(bigCv, i, lidSize, 0);
}

function onRead(){
  if(openIdx < 0) return;
  const max = recEl.scrollHeight - recEl.clientHeight;
  const p = max > 0 ? Math.max(0, Math.min(1, recEl.scrollTop / max)) : 0;
  if(Math.abs(p - readP) < 0.004) return;      // redraw in steps, not every pixel
  readP = p;
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{
    rafPending = false;
    paintLid(bigCv, openIdx, lidSize, wearAt(readP));
    recEl.style.setProperty("--r", readP.toFixed(3));
    recEl.classList.toggle("late", readP > 0.74);
  });
}
recEl.addEventListener("scroll", onRead, {passive:true});

function closeRecord(){
  openIdx = -1; kWant = 0;

/* ------------------------------------------------------ the block, heard
   Nothing is sampled. A low bed of traffic, footsteps that come near and go
   away again, and the occasional car at the end of the street — all synthesised,
   so the page carries no audio files. */
const Ambient = (function(){
  let ctx = null, master = null, noise = null, running = false;
  const timers = [];

  function makeNoise(seconds){
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<n;i++){                       // brown-ish: warmer than white
      const w = Math.random()*2 - 1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.2;
    }
    return buf;
  }

  function bed(){                                // distant traffic, always there
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = 0.6;
    const g = ctx.createGain(); g.gain.value = 0.16;
    src.connect(lp).connect(g).connect(master);
    src.start();

    // the hum breathes rather than sits still
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = 0.045; lfoG.gain.value = 90;
    lfo.connect(lfoG).connect(lp.frequency);
    lfo.start();
  }

  function step(when, gain, pan){
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(pn) pn.pan.value = pan;
    const out = pn || ctx.createGain();
    out.connect(master);

    // the scuff: a short band of noise
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500 + Math.random()*900;
    bp.Q.value = 0.9 + Math.random()*0.6;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0, when);
    g1.gain.linearRampToValueAtTime(gain * 0.5, when + 0.004);
    g1.gain.exponentialRampToValueAtTime(0.0001, when + 0.075 + Math.random()*0.03);
    src.connect(bp).connect(g1).connect(out);
    src.start(when); src.stop(when + 0.2);

    // the weight: a short low thump under it
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(96 + Math.random()*28, when);
    osc.frequency.exponentialRampToValueAtTime(52, when + 0.09);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, when);
    g2.gain.linearRampToValueAtTime(gain * 0.42, when + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.11);
    osc.connect(g2).connect(out);
    osc.start(when); osc.stop(when + 0.25);
  }

  /* someone walks past: near, then further, then gone, then someone else */
  let prox = 0.3, pan = 0, pace = 0.52, leftFoot = true;
  function walk(){
    if(!running) return;
    const t = ctx.currentTime + 0.03;
    const gain = 0.05 + 0.5 * prox * prox;
    step(t, gain * (leftFoot ? 1 : 0.88), pan + (leftFoot ? -0.07 : 0.07));
    leftFoot = !leftFoot;

    prox = Math.max(0.02, Math.min(1, prox + (Math.random()-0.5)*0.12));
    pan  = Math.max(-0.8, Math.min(0.8, pan + (Math.random()-0.5)*0.1));

    let wait = pace * (0.93 + Math.random()*0.14);
    if(Math.random() < 0.05){            // they are gone; the street is empty a while
      wait += 2.5 + Math.random()*5;
      prox = 0.05 + Math.random()*0.25;
      pan  = (Math.random()*2 - 1) * 0.7;
      pace = 0.46 + Math.random()*0.16;
    }
    timers.push(setTimeout(walk, wait*1000));
  }

  function car(){                        // one passing at the end of the block
    if(!running) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(190, t);
    bp.frequency.linearRampToValueAtTime(620, t + 2.2);
    bp.frequency.linearRampToValueAtTime(170, t + 5.0);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t + 2.0);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5.2);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 5.4);
    timers.push(setTimeout(car, (11 + Math.random()*22) * 1000));
  }

  function start(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      noise = makeNoise(3);
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      bed();
    }
    if(ctx.state === "suspended") ctx.resume();
    running = true;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 2.2);   // fades up
    walk();
    timers.push(setTimeout(car, 4000));
    return true;
  }

  function stop(){
    running = false;
    while(timers.length) clearTimeout(timers.pop());
    if(!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
  }

  return { start, stop };
})();

/* Browsers hold audio until the visitor has touched the page, so the street
   starts itself on whatever they do first — a move, a click, a key. */
let soundStarted = false;
function wakeSound(){
  if(soundStarted) return;
  soundStarted = Ambient.start();
  if(soundStarted){
    ["pointerdown","pointermove","keydown","wheel","touchstart"]
      .forEach(ev => window.removeEventListener(ev, wakeSound));
  }
}
["pointerdown","pointermove","keydown","wheel","touchstart"]
  .forEach(ev => window.addEventListener(ev, wakeSound, {passive:true}));

document.addEventListener("visibilitychange", ()=>{
  if(!soundStarted) return;
  if(document.hidden) Ambient.stop(); else Ambient.start();
});

/* -------------------------------------------------------------------- loop */
let last = 0, ready = false;
function frame(t){
  const dt = last ? Math.min(0.1, (t - last)/1000) : 0;
  last = t;
  if(ready){
    let moving = false;
    if(Math.abs(kWant - k) > 0.0008){ k += (kWant - k) * Math.min(1, dt * 7.5); moving = true; }
    else if(k !== kWant){ k = kWant; moving = true; }
    if(!dragging && Math.abs(target - pos) > 0.0008){ pos += (target - pos) * Math.min(1, dt * (k > 0.5 ? 4.8 : 8.5)); moving = true; }
    if(moving) place();
  }
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

})();
